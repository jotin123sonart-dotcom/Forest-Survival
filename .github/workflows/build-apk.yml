name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index1.html"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create web folder
        run: |
          mkdir -p www
          cp index1.html www/index.html

      - name: Initialize Capacitor
        run: |
          npx cap init "Survival World" "com.survivalworld.game" --web-dir www
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Survival-World-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
